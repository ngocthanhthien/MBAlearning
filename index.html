<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBA+ · Executive Learning</title>
<style>
  :root{
    --bg:#141414;
    --bg-2:#181818;
    --surface:#1f1f1f;
    --surface-2:#2a2a2a;
    --surface-3:#333;
    --border:#2c2c2c;
    --border-2:#3a3a3a;
    --txt:#ffffff;
    --txt-2:#d2d2d2;
    --txt-3:#8c8c8c;
    --accent:#e50914;
    --accent-2:#f6121d;
    --accent-soft:rgba(229,9,20,.16);
    --gold:#e5b109;
    --green:#46d369;
    --green-soft:rgba(70,211,105,.16);
    --amber:#f5c518;
    --amber-soft:rgba(245,197,24,.16);
    --purple:#a78bfa;
    --radius:8px;
    --shadow:0 12px 40px rgba(0,0,0,.7);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;border:2px solid var(--bg)}

  /* ================= TOP NAV ================= */
  .nav{
    position:fixed;top:0;left:0;right:0;height:68px;z-index:90;
    display:flex;align-items:center;justify-content:space-between;padding:0 4%;
    background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.3) 60%,transparent 100%);
    transition:background .3s;
  }
  .nav.scrolled{background:var(--bg)}
  .nav-left{display:flex;align-items:center;gap:30px}
  .logo{font-size:26px;font-weight:900;letter-spacing:-1px;color:var(--accent);display:flex;align-items:center}
  .logo span{color:var(--txt);font-weight:800}
  .nav-links{display:flex;gap:20px;align-items:center}
  .nav-links a{font-size:14px;color:var(--txt-2);font-weight:500;transition:.15s;position:relative;white-space:nowrap}
  .nav-links a:hover{color:#fff}
  .nav-links a.active{color:#fff;font-weight:700}
  .nav-ms-wrap{position:relative}
  .nav-ms{display:flex;align-items:center;gap:5px;cursor:pointer}
  .ms-dropdown{
    position:absolute;top:32px;left:50%;transform:translateX(-50%) translateY(8px);
    background:rgba(0,0,0,.95);border:1px solid var(--border);border-radius:8px;padding:8px;width:240px;
    opacity:0;visibility:hidden;transition:.18s;box-shadow:var(--shadow);
  }
  .nav-ms-wrap:hover .ms-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .ms-dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:13px;color:var(--txt-2);cursor:pointer}
  .ms-dd-item:hover{background:var(--surface-2);color:#fff}
  .ms-dd-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .ms-dd-item .pc{margin-left:auto;font-size:11px;color:var(--txt-3)}
  .nav-right{display:flex;align-items:center;gap:16px}
  .nav-search{display:flex;align-items:center;background:rgba(0,0,0,.6);border:1px solid var(--border-2);border-radius:4px;padding:0 10px;height:36px;transition:.2s}
  .nav-search svg{opacity:.8;flex-shrink:0}
  .nav-search input{background:none;border:none;outline:none;color:#fff;font-size:13px;width:170px;padding:0 8px}
  .nav-search input::placeholder{color:var(--txt-3)}
  .lang-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt-2);border:1px solid var(--border-2);border-radius:4px;height:36px;padding:0 12px;transition:.15s}
  .lang-toggle:hover{color:#fff;border-color:var(--txt-3)}
  .lang-toggle b{color:var(--accent)}
  .nav-ic{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--txt-2);transition:.15s}
  .nav-ic:hover{background:var(--surface-2);color:#fff}
  .avatar{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#7a0008);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
  .nav-ic.spinning svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= HERO ================= */
  .home{padding-bottom:50px}
  .hero{position:relative;height:80vh;min-height:520px;max-height:760px;display:flex;align-items:flex-end;padding:0 4% 0;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.02)}
  .hero-fade{position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(20,20,20,.95) 0%,rgba(20,20,20,.65) 35%,rgba(20,20,20,.1) 70%),
    linear-gradient(0deg,var(--bg) 2%,transparent 40%)}
  .hero-content{position:relative;z-index:2;max-width:640px;padding-bottom:7vh}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
  .hero .eyebrow .tag{background:var(--accent);color:#fff;padding:3px 9px;border-radius:3px;letter-spacing:1px}
  .hero h1{font-size:clamp(34px,5vw,62px);font-weight:900;letter-spacing:-1.5px;line-height:1.04;margin-bottom:16px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .hero p{font-size:clamp(14px,1.3vw,18px);color:var(--txt-2);max-width:560px;margin-bottom:14px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .hero .meta-line{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--txt-2);margin-bottom:22px;flex-wrap:wrap}
  .hero .meta-line .match{color:var(--green);font-weight:700}
  .hero .meta-line .pill{border:1px solid var(--border-2);border-radius:3px;padding:1px 8px;font-size:12px}
  .hero-btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn-play{display:inline-flex;align-items:center;gap:9px;background:#fff;color:#000;font-weight:700;font-size:16px;padding:11px 26px;border-radius:5px;transition:.15s}
  .btn-play:hover{background:rgba(255,255,255,.78)}
  .btn-more{display:inline-flex;align-items:center;gap:9px;background:rgba(109,109,110,.55);color:#fff;font-weight:700;font-size:16px;padding:11px 22px;border-radius:5px;transition:.15s}
  .btn-more:hover{background:rgba(109,109,110,.4)}

  /* ================= ROWS ================= */
  .rows{margin-top:-6vh;position:relative;z-index:5}
  .row{margin-bottom:6px;padding:14px 0}
  .row-title{font-size:21px;font-weight:800;letter-spacing:-.3px;padding:0 4%;margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .row-title .row-count{font-size:12px;font-weight:700;color:var(--txt-3);background:var(--surface-2);padding:2px 9px;border-radius:20px}
  .row-wrap{position:relative}
  .row-track{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:26px 4%;scroll-behavior:smooth;scrollbar-width:none}
  .row-track::-webkit-scrollbar{display:none;height:0}
  .row-nav{position:absolute;top:0;bottom:0;width:4%;z-index:20;background:rgba(0,0,0,.5);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
  .row-wrap:hover .row-nav{opacity:1}
  .row-nav.left{left:0}.row-nav.right{right:0}
  .row-nav:hover{background:rgba(0,0,0,.75)}

  /* ---- Topic tile (Netflix "title") ---- */
  .tile{flex:0 0 270px;cursor:pointer;transition:transform .25s;position:relative}
  .tile:hover{transform:scale(1.09);z-index:30}
  .tile-img{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .tile-grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.45) 100%)}
  .tile-badge{position:absolute;top:9px;left:9px;font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:3px;letter-spacing:.5px}
  .tile-name{position:absolute;left:12px;right:12px;bottom:14px;font-size:16px;font-weight:800;line-height:1.18;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .tile-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
  .tile-prog i{display:block;height:100%;background:var(--accent)}
  .tile-hover{opacity:0;transition:.2s;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-radius:0 0 6px 6px;padding:12px;box-shadow:var(--shadow);pointer-events:none}
  .tile:hover .tile-hover{opacity:1;pointer-events:auto}
  .tile-hover .th-actions{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .tile-hover .rbtn{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;background:#fff;color:#000;font-size:13px}
  .tile-hover .rbtn.ghost{background:transparent;color:#fff}
  .tile-hover .th-name{font-size:13px;font-weight:700}
  .tile-hover .th-meta{font-size:12px;color:var(--txt-3)}

  /* ---- Video card ---- */
  .vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .row-track .vcard{flex:0 0 290px}
  .vcard{background:var(--surface);border-radius:6px;overflow:hidden;transition:transform .25s,box-shadow .25s;position:relative}
  .vcard:hover{transform:scale(1.05);z-index:30;box-shadow:var(--shadow)}
  .vthumb{position:relative;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden;cursor:pointer}
  .vthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .vthumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.85);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px}
  .vthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s;background:rgba(0,0,0,.3)}
  .vcard:hover .vthumb .play{opacity:1}
  .vthumb .play span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}
  .vthumb .status-tag{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
  .vthumb .status-tag.done{background:var(--green);color:#062b13}
  .vthumb .status-tag.prog{background:var(--amber);color:#3a2c05}
  .vbody{padding:12px 13px 13px}
  .vtitle{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin-bottom:5px}
  .vchan{font-size:11.5px;color:var(--txt-3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .vreveal{max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .2s}
  .vcard:hover .vreveal,.vcard:focus-within .vreveal{max-height:300px;opacity:1;margin-top:10px}
  .vrate{display:flex;gap:2px;margin-bottom:9px}
  .vrate .st{cursor:pointer;color:var(--surface-3);transition:.12s;font-size:15px}
  .vrate .st.on{color:var(--gold)}
  .vrate .st:hover{color:var(--gold)}
  .vactions{display:flex;gap:6px}
  .vbtn{flex:1;height:32px;border-radius:5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--txt-2);transition:.14s}
  .vbtn:hover{background:var(--surface-3);color:#fff}
  .vbtn.active-done{background:var(--green-soft);border-color:rgba(70,211,105,.5);color:var(--green)}
  .vbtn.active-prog{background:var(--amber-soft);border-color:rgba(245,197,24,.5);color:var(--amber)}
  .vbtn.active-mark{background:var(--accent-soft);border-color:rgba(229,9,20,.5);color:#ff5a63}
  .vbtn.icon-only{flex:0 0 34px}
  .vnote{margin-top:9px}
  .vnote textarea{width:100%;min-height:64px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:6px;color:var(--txt);padding:9px;font-size:12px;resize:vertical;outline:none}
  .vnote textarea:focus{border-color:var(--accent)}

  /* ---- Skeleton ---- */
  .skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .skel-card{background:var(--surface);border-radius:6px;overflow:hidden}
  .skel-card .st-thumb{aspect-ratio:16/9}
  .skel-card .st-body{padding:13px;display:flex;flex-direction:column;gap:8px}

  /* ================= INNER PAGES ================= */
  .page{padding:108px 4% 70px;max-width:1500px;margin:0 auto}
  .page-head{margin-bottom:26px}
  .page-head .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:800;margin-bottom:8px}
  .page-head h2{font-size:30px;font-weight:900;letter-spacing:-.6px}
  .page-head p{color:var(--txt-2);font-size:14.5px;margin-top:8px;max-width:640px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:28px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
  .stat .ic-wrap{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
  .stat .lbl{font-size:11.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  .stat .val{font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:4px;line-height:1.1}
  .stat .sub{font-size:12px;color:var(--txt-2);margin-top:6px}

  .pbar{height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease}
  .pbar.green>i{background:linear-gradient(90deg,#2a9d52,var(--green))}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
  .section{margin-bottom:30px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .section-head h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}
  .section-head .badge{font-size:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt-2);padding:3px 9px;border-radius:20px;font-weight:700}
  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:1000px){.two-col{grid-template-columns:1fr}}

  /* milestone topic rows */
  .topic-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .topic-row{display:flex;align-items:center;gap:12px;padding:13px;border-radius:8px;background:var(--surface);border:1px solid var(--border);transition:.15s;cursor:pointer}
  .topic-row:hover{background:var(--surface-2);border-color:var(--border-2)}
  .topic-row .t-ic{width:32px;height:32px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
  .topic-row .t-name{font-size:14px;font-weight:700}
  .topic-row .t-meta{font-size:11.5px;color:var(--txt-3)}
  .topic-row .t-prog{width:100px}

  .row-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .row-tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--txt-3);border-bottom:2px solid transparent;transition:.15s;display:flex;align-items:center;gap:7px}
  .row-tab:hover{color:var(--txt-2)}
  .row-tab.active{color:#fff;border-bottom-color:var(--accent)}
  .row-tab .cnt{background:var(--surface-2);border-radius:20px;padding:1px 7px;font-size:10.5px;color:var(--txt-2)}

  .empty{text-align:center;padding:50px 20px;color:var(--txt-3)}
  .empty svg{opacity:.4;margin-bottom:12px}
  .empty p{font-size:14px}
  .empty .sm{font-size:12.5px;margin-top:4px}

  .rs-item{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--border)}
  .rs-item:last-child{border-bottom:none}
  .rs-thumb{width:104px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--surface-3)}
  .rs-thumb img{width:100%;height:100%;object-fit:cover}
  .rs-info{flex:1;min-width:0}
  .rs-info b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs-info span{font-size:11.5px;color:var(--txt-3)}
  .rs-when{font-size:11.5px;color:var(--txt-3);white-space:nowrap}

  .reco{background:linear-gradient(135deg,rgba(229,9,20,.22),rgba(0,0,0,.2));border:1px solid var(--border-2);border-radius:var(--radius);padding:22px}
  .reco .rk{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#ff5a63;font-weight:800}
  .reco h4{font-size:21px;font-weight:900;margin:8px 0 4px}
  .reco p{font-size:13px;color:var(--txt-2);margin-bottom:16px}

  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:5px;font-size:13.5px;font-weight:700;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-2)}
  .btn-ghost{background:var(--surface-2);color:var(--txt-2);border:1px solid var(--border-2)}
  .btn-ghost:hover{background:var(--surface-3);color:#fff}

  .api-banner{background:var(--accent-soft);border:1px solid rgba(229,9,20,.4);border-radius:var(--radius);padding:14px 18px;margin-bottom:22px;display:flex;align-items:center;gap:12px;font-size:13px;color:#ff8a90}
  .api-banner b{color:#fff}
  .api-banner .api-in{margin-left:auto;display:flex;gap:8px}
  .api-banner input{height:34px;border-radius:5px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--txt);padding:0 12px;font-size:12.5px;width:230px;outline:none}

  /* settings */
  .opt-group{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border);cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--border-2);background:var(--surface-2)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .opt.sel .radio{border-color:var(--accent)}
  .opt .radio i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
  .opt b{display:block;font-size:14px;font-weight:700}
  .opt small{display:block;font-size:12px;color:var(--txt-3);margin-top:2px}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;padding:13px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  @keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

  .hidden{display:none!important}
  @media(max-width:760px){
    .nav-links{display:none}
    .nav-search input{width:110px}
    .hero{height:70vh;min-height:440px}
    .two-col{grid-template-columns:1fr}
    .page{padding-top:92px}
  }
</style>
</head>
<body>
  <!-- ============ TOP NAV ============ -->
  <header class="nav" id="nav">
    <div class="nav-left">
      <a class="logo" data-route="dashboard">MBA<span>+</span></a>
      <nav class="nav-links" id="navLinks">
        <a data-route="dashboard">Home</a>
        <a data-route="bookmarks">My List</a>
        <a data-route="completed">Completed</a>
        <div class="nav-ms-wrap">
          <a class="nav-ms">Milestones
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </a>
          <div class="ms-dropdown" id="msDropdown"></div>
        </div>
      </nav>
    </div>
    <div class="nav-right">
      <div class="nav-search">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = { API_KEY: "PUT_API_KEY_HERE" };

/* =========================================================
   MBA ROADMAP
   ========================================================= */
const ROADMAP = [
  { id:"m1", n:1, title:"Self Management", color:"#e50914",
    desc:"Master yourself before you lead others — career, communication and influence.",
    topics:["Career Management","Managing Your Boss","Presentation Skills","Persuading Others","Difficult Interactions"]},
  { id:"m2", n:2, title:"Team Management", color:"#b81d24",
    desc:"Build and run high-performing teams through delegation, coaching and measurement.",
    topics:["Delegating","Coaching","Feedback Essentials","Meeting Management","Performance Appraisal","Performance Measurement"]},
  { id:"m3", n:3, title:"People Leadership", color:"#46d369",
    desc:"Lead, attract and grow talent across diverse and inclusive organisations.",
    topics:["Leading People","Attracting And Cultivating Talent","Diversity Inclusion And Belonging"]},
  { id:"m4", n:4, title:"Cross-Functional Leadership", color:"#f5c518",
    desc:"Lead beyond your function — customers, global teams and innovation.",
    topics:["Customer Focus","Global Collaboration","Innovation And Creativity"]},
  { id:"m5", n:5, title:"Business Leadership", color:"#7b2ff7",
    desc:"Think like an executive — turn ideas into compelling business cases.",
    topics:["Business Case Development"]}
];

const ALL_TOPICS = ROADMAP.flatMap(m => m.topics.map(t => ({topic:t, ms:m})));
function topicId(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function findTopic(id){ return ALL_TOPICS.find(x => topicId(x.topic) === id); }

/* ---- Bilingual keyword libraries (English + Vietnamese) ---- */
const TOPIC_KEYWORDS = {
  "Career Management":{english:["career management strategy","executive career development","career growth for managers"],vietnamese:["quản lý sự nghiệp","phát triển sự nghiệp","định hướng nghề nghiệp quản lý"]},
  "Managing Your Boss":{english:["managing your boss","how to manage up","working with your manager"],vietnamese:["làm việc với sếp","quản lý sếp của bạn","kỹ năng quản lý cấp trên"]},
  "Presentation Skills":{english:["executive presentation skills","business presentation skills","presentation skills for managers"],vietnamese:["kỹ năng thuyết trình","thuyết trình chuyên nghiệp","thuyết trình cho quản lý"]},
  "Persuading Others":{english:["persuasion skills business","influencing and persuading others","art of persuasion leadership"],vietnamese:["kỹ năng thuyết phục","nghệ thuật thuyết phục","kỹ năng gây ảnh hưởng"]},
  "Difficult Interactions":{english:["handling difficult conversations","difficult conversations at work","managing difficult interactions"],vietnamese:["xử lý cuộc trò chuyện khó khăn","giao tiếp trong tình huống khó","kỹ năng xử lý xung đột"]},
  "Delegating":{english:["delegation skills for managers","how to delegate effectively","delegating tasks leadership"],vietnamese:["kỹ năng giao việc","ủy thác công việc","giao việc hiệu quả cho nhân viên"]},
  "Coaching":{english:["leadership coaching","manager coaching employees","coaching skills for managers"],vietnamese:["kỹ năng coaching nhân viên","huấn luyện nhân viên","coaching trong quản lý"]},
  "Feedback Essentials":{english:["giving effective feedback","feedback skills for managers","constructive feedback at work"],vietnamese:["kỹ năng phản hồi","đưa phản hồi hiệu quả","góp ý cho nhân viên"]},
  "Meeting Management":{english:["effective meeting management","running better meetings","meeting facilitation skills"],vietnamese:["quản lý cuộc họp hiệu quả","kỹ năng điều hành cuộc họp","tổ chức cuộc họp chuyên nghiệp"]},
  "Performance Appraisal":{english:["performance appraisal management","employee performance review","conducting performance appraisals"],vietnamese:["đánh giá hiệu suất nhân viên","đánh giá năng lực nhân viên","quy trình đánh giá nhân sự"]},
  "Performance Measurement":{english:["performance measurement business","KPI and performance metrics","measuring team performance"],vietnamese:["đo lường hiệu suất","chỉ số KPI quản lý","đo lường hiệu quả công việc"]},
  "Leading People":{english:["leading people effectively","people leadership skills","how to lead a team"],vietnamese:["kỹ năng lãnh đạo con người","lãnh đạo đội nhóm","nghệ thuật lãnh đạo"]},
  "Attracting And Cultivating Talent":{english:["attracting and developing talent","talent management strategy","cultivating talent in organizations"],vietnamese:["thu hút và phát triển nhân tài","quản trị nhân tài","phát triển nhân tài trong tổ chức"]},
  "Diversity Inclusion And Belonging":{english:["diversity inclusion and belonging","inclusive leadership","diversity and inclusion at work"],vietnamese:["đa dạng và hòa nhập","lãnh đạo hòa nhập","văn hóa đa dạng nơi làm việc"]},
  "Customer Focus":{english:["customer focus strategy","customer centricity business","building a customer focused culture"],vietnamese:["tập trung vào khách hàng","tư duy lấy khách hàng làm trung tâm","định hướng khách hàng"]},
  "Global Collaboration":{english:["global team collaboration","leading global teams","cross cultural collaboration"],vietnamese:["hợp tác toàn cầu","làm việc nhóm đa quốc gia","cộng tác xuyên văn hóa"]},
  "Innovation And Creativity":{english:["innovation and creativity business","fostering innovation leadership","creativity in the workplace"],vietnamese:["đổi mới và sáng tạo","tư duy sáng tạo trong kinh doanh","thúc đẩy đổi mới sáng tạo"]},
  "Business Case Development":{english:["business case development MBA","business case analysis","how to build a business case"],vietnamese:["xây dựng business case","phân tích tình huống kinh doanh","lập đề án kinh doanh"]}
};
function activeLangKey(){ return STATE.lang==="vi" ? "vietnamese" : "english"; }
function getKeywords(topic){
  const k = TOPIC_KEYWORDS[topic];
  const arr = k && k[activeLangKey()];
  if(arr && arr.length) return arr;
  return STATE.lang==="vi" ? [topic+" kỹ năng quản lý lãnh đạo"] : [topic+" leadership management skills"];
}
function searchQuery(topic){ return getKeywords(topic)[0]; }
function cacheKey(tid){ return tid + "_" + (STATE.lang==="vi"?"vi":"en"); }

/* ---- Preferred Vietnamese channels (ranking boost) ---- */
const VI_PREFERRED = ["hbr","tedx","spiderum","vietnam business insider","cafef","vtv money","fpt skillking","pace"];
function isPreferredChannel(channel){
  if(STATE.lang!=="vi") return false;
  const c=(channel||"").toLowerCase();
  return VI_PREFERRED.some(p=>c.includes(p));
}
function rankScore(v){ return (v.views||0) + (isPreferredChannel(v.channel)?1e12:0); }

/* =========================================================
   STORAGE
   ========================================================= */
const LS = { state:"mba_state_v1", cache:"mba_cache_v1", key:"mba_apikey_v1" };
function loadJSON(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
function saveJSON(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

let STATE = loadJSON(LS.state, {});
STATE.videos ??= {};
STATE.days ??= [];
STATE.streakUpdated ??= null;
STATE.lang ??= "en";
STATE.openIn ??= "new";
STATE.activityCount ??= 0;
STATE.history ??= [];
STATE.lastStudied ??= null;
let CACHE = loadJSON(LS.cache, {});

function getApiKey(){
  const stored = localStorage.getItem(LS.key);
  if(stored) return stored;
  if(CONFIG.API_KEY && CONFIG.API_KEY !== "PUT_API_KEY_HERE") return CONFIG.API_KEY;
  return null;
}
function persist(){ saveJSON(LS.state, STATE); }
function persistCache(){ saveJSON(LS.cache, CACHE); }
function rec(id){ return STATE.videos[id] || null; }
function ensureRec(v){
  if(!STATE.videos[v.id]){
    STATE.videos[v.id] = { status:null, bookmarked:false, note:"", rating:0,
      dur:v.dur, title:v.title, thumb:v.thumb, channel:v.channel, topic:v.topic, updated:Date.now() };
  } else {
    Object.assign(STATE.videos[v.id], { dur:v.dur, title:v.title, thumb:v.thumb, channel:v.channel, topic:v.topic });
  }
  return STATE.videos[v.id];
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(!STATE.days.includes(today)) STATE.days.push(today);
  STATE.streakUpdated = today;
}

/* =========================================================
   YOUTUBE DATA API v3
   ========================================================= */
const API_BASE = "https://www.googleapis.com/youtube/v3";
function parseDuration(iso){
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||"");
  if(!m) return {sec:0,label:"0:00"};
  const h=+(m[1]||0), mi=+(m[2]||0), s=+(m[3]||0);
  const sec = h*3600+mi*60+s;
  const label = h>0 ? `${h}:${String(mi).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${mi}:${String(s).padStart(2,"0")}`;
  return {sec,label};
}
function fmtViews(n){ n=+n||0;
  if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"")+"B";
  if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return ""+n;
}
function fmtAgo(iso){
  const d=new Date(iso); const diff=(Date.now()-d.getTime())/1000; const day=diff/86400;
  if(day<1) return "today"; if(day<2) return "yesterday";
  if(day<30) return Math.floor(day)+"d ago";
  if(day<365) return Math.floor(day/30)+"mo ago";
  return Math.floor(day/365)+"y ago";
}
async function ytFetch(path, params){
  const key = getApiKey();
  if(!key) throw new Error("NO_API_KEY");
  const url = new URL(API_BASE + path);
  Object.entries({...params, key}).forEach(([k,v]) => url.searchParams.set(k,v));
  const res = await fetch(url);
  if(!res.ok){
    const body = await res.json().catch(()=>({}));
    const reason = body?.error?.errors?.[0]?.reason || body?.error?.message || res.status;
    throw new Error("YT_ERROR: " + reason);
  }
  return res.json();
}
async function fetchTopic(topic, {force=false}={}){
  const tid = topicId(topic);
  const ck = cacheKey(tid);
  const lang = STATE.lang==="vi"?"vi":"en";
  const cached = CACHE[ck];
  const MAX_AGE = 1000*60*60*12;
  if(!force && cached && (Date.now()-cached.fetched) < MAX_AGE && cached.items?.length) return cached.items;
  const params = { part:"snippet", q:searchQuery(topic), type:"video", maxResults:24,
    relevanceLanguage:lang, videoEmbeddable:"true", safeSearch:"strict", order:"relevance" };
  if(lang==="vi") params.regionCode = "VN";
  const search = await ytFetch("/search", params);
  const ids = (search.items||[]).map(i => i.id.videoId).filter(Boolean);
  if(!ids.length){ CACHE[ck]={items:[],fetched:Date.now()}; persistCache(); return []; }
  const det = await ytFetch("/videos", { part:"snippet,contentDetails,statistics", id:ids.join(",") });
  const items = (det.items||[]).map(v => {
    const dur = parseDuration(v.contentDetails?.duration);
    return { id:v.id, title:v.snippet.title, channel:v.snippet.channelTitle,
      thumb:(v.snippet.thumbnails?.medium||v.snippet.thumbnails?.high||v.snippet.thumbnails?.default||{}).url || "",
      published:v.snippet.publishedAt, views:+(v.statistics?.viewCount||0),
      dur:dur.sec, durLabel:dur.label, topic:tid };
  }).filter(v => v.dur >= 90);
  CACHE[ck] = { items, fetched:Date.now() };
  persistCache();
  return items;
}

/* =========================================================
   METRICS
   ========================================================= */
function completedVideos(){ return Object.entries(STATE.videos).filter(([,r])=>r.status==="completed"); }
function inProgressVideos(){ return Object.entries(STATE.videos).filter(([,r])=>r.status==="in-progress"); }
function bookmarkedVideos(){ return Object.entries(STATE.videos).filter(([,r])=>r.bookmarked); }
function learningSeconds(){ return completedVideos().reduce((s,[,r])=>s+(r.dur||0),0); }
function learningHours(){ return learningSeconds()/3600; }
function topicProgress(tid){
  const TARGET=6; const done=completedVideos().filter(([,r])=>r.topic===tid).length;
  return Math.min(100, Math.round(done/TARGET*100));
}
function msProgress(m){ const arr=m.topics.map(t=>topicProgress(topicId(t))); return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length); }
function overallProgress(){ const arr=ROADMAP.map(msProgress); return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length); }
function currentStreak(){
  if(!STATE.days.length) return 0;
  const set=new Set(STATE.days); let streak=0; let d=new Date();
  const todayStr=d.toISOString().slice(0,10);
  if(!set.has(todayStr)) d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function recentlyStudied(limit=12){
  return Object.entries(STATE.videos).filter(([,r])=>r.status||r.opened)
    .sort((a,b)=>b[1].updated-a[1].updated).slice(0,limit);
}
function recommendedTopic(){
  for(const m of ROADMAP){ for(const t of m.topics){ if(topicProgress(topicId(t))<100) return {topic:t, ms:m}; } }
  const last=ROADMAP[ROADMAP.length-1];
  return {topic:last.topics[last.topics.length-1], ms:last};
}
function topicRepVideo(tid){ return CACHE[cacheKey(tid)]?.items?.[0] || null; }

/* =========================================================
   ACTIONS
   ========================================================= */
function setStatus(v, status){
  const r=ensureRec(v); r.status=(r.status===status)?null:status; r.updated=Date.now();
  if(r.status) touchStreak();
  persist(); rerender();
  toast(r.status ? (status==="completed"?"Marked completed ✓":"Marked in progress") : "Status cleared");
}
function toggleBookmark(v){
  const r=ensureRec(v); r.bookmarked=!r.bookmarked; r.updated=Date.now();
  persist(); rerender(); toast(r.bookmarked?"Added to My List":"Removed from My List");
}
function setRating(v, n){ const r=ensureRec(v); r.rating=(r.rating===n)?0:n; r.updated=Date.now(); persist(); rerender(); }
function setNote(id, text){ if(STATE.videos[id]){ STATE.videos[id].note=text; STATE.videos[id].updated=Date.now(); persist(); } }

function openVideo(idOrObj){
  const id = typeof idOrObj==="string" ? idOrObj : idOrObj.id;
  const obj = typeof idOrObj==="object" ? idOrObj : resolveVideo(id);
  if(obj) ensureRec(obj);
  const r = STATE.videos[id];
  if(r){ r.opened=true; r.lastOpened=Date.now(); r.updated=Date.now(); }
  STATE.activityCount=(STATE.activityCount||0)+1;
  STATE.history.push({ id, ts:Date.now() });
  if(STATE.history.length>300) STATE.history=STATE.history.slice(-300);
  STATE.lastStudied=new Date().toISOString().slice(0,10);
  touchStreak(); persist();
  const url="https://www.youtube.com/watch?v="+id;
  if(STATE.openIn==="same"){ window.location.href=url; }
  else { window.open(url,"_blank","noopener"); rerender(); }
}

/* =========================================================
   TOASTS
   ========================================================= */
function toast(msg){
  const wrap=document.getElementById("toasts");
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<span class="dot"></span>${msg}`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".3s"; setTimeout(()=>el.remove(),300); },2400);
}

/* =========================================================
   RENDER HELPERS
   ========================================================= */
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function secLabel(sec){ sec=+sec||0; const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; }
function hqThumb(v){ return v && v.id ? `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg` : ""; }

function vcard(v){
  const r=rec(v.id)||{};
  const durLabel=v.durLabel||secLabel(v.dur);
  const statusTag=r.status==="completed"?`<span class="status-tag done">Completed</span>`
    :r.status==="in-progress"?`<span class="status-tag prog">Learning</span>`:"";
  const meta=[]; if(v.channel) meta.push(esc(v.channel));
  if(v.views) meta.push(fmtViews(v.views)+" views"); if(v.published) meta.push(fmtAgo(v.published));
  const stars=[1,2,3,4,5].map(n=>`<span class="st ${(r.rating||0)>=n?'on':''}" data-rate="${n}">★</span>`).join("");
  return `
  <div class="vcard" data-vid="${v.id}">
    <div class="vthumb" data-open="${v.id}">
      ${v.thumb?`<img loading="lazy" src="${v.thumb}" alt="">`:""}
      ${statusTag}<span class="dur">${durLabel}</span>
      <div class="play"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21"/></svg></span></div>
    </div>
    <div class="vbody">
      <div class="vtitle" data-open="${v.id}">${esc(v.title)}</div>
      <div class="vchan">${meta.join(" · ")}</div>
      <div class="vreveal">
        <div class="vrate" data-ratefor="${v.id}">${stars}</div>
        <div class="vactions">
          <button class="vbtn ${r.status==="completed"?"active-done":""}" data-act="complete">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>Done</button>
          <button class="vbtn ${r.status==="in-progress"?"active-prog":""}" data-act="progress">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>Learning</button>
          <button class="vbtn icon-only ${r.bookmarked?"active-mark":""}" data-act="bookmark" title="My List">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="${r.bookmarked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
          <button class="vbtn icon-only ${r.note?"active-mark":""}" data-act="note" title="Notes">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
        </div>
        <div class="vnote hidden" data-notepanel="${v.id}">
          <textarea placeholder="Key takeaways, how to apply at work…">${esc(r.note||"")}</textarea>
        </div>
      </div>
    </div>
  </div>`;
}
function topicTile(topic){
  const tid=topicId(topic); const x=findTopic(tid); const ms=x.ms; const p=topicProgress(tid);
  const rep=topicRepVideo(tid);
  const bg = rep ? `background-image:url('${hqThumb(rep)}')` : `background:linear-gradient(135deg,${ms.color},#000)`;
  const done=completedVideos().filter(([,r])=>r.topic===tid).length;
  return `
  <div class="tile" data-topicopen="${tid}">
    <div class="tile-img" style="${bg}">
      <div class="tile-grad"></div>
      <span class="tile-badge" style="background:${ms.color}">M${ms.n}</span>
      <div class="tile-name">${topic}</div>
      ${p>0?`<div class="tile-prog"><i style="width:${p}%"></i></div>`:""}
    </div>
    <div class="tile-hover">
      <div class="th-actions">
        <span class="rbtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21"/></svg></span>
        <span class="th-name">${topic}</span>
      </div>
      <div class="th-meta">${p}% complete · ${done} done · Milestone ${ms.n}</div>
    </div>
  </div>`;
}
function skelGrid(n=8){
  return `<div class="vid-grid">${Array.from({length:n}).map(()=>`
    <div class="skel-card"><div class="skel st-thumb"></div>
      <div class="st-body"><div class="skel" style="height:14px;width:90%"></div>
      <div class="skel" style="height:12px;width:55%"></div></div></div>`).join("")}</div>`;
}
function emptyState(text, sub){
  return `<div class="empty">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3l-4 4-4-4"/></svg>
    <p>${text}</p>${sub?`<p class="sm">${sub}</p>`:""}</div>`;
}
function row(title, cardsHtml, count){
  return `<section class="row">
    <h3 class="row-title">${title}${count!=null?`<span class="row-count">${count}</span>`:""}</h3>
    <div class="row-wrap">
      <button class="row-nav left">‹</button>
      <div class="row-track">${cardsHtml}</div>
      <button class="row-nav right">›</button>
    </div>
  </section>`;
}

/* =========================================================
   ROUTER
   ========================================================= */
let ROUTE = { name:"dashboard", arg:null };
function navigate(name, arg=null){ ROUTE={name,arg}; window.scrollTo(0,0); rerender(); }
function rerender(){
  renderNav();
  if(ROUTE.name==="dashboard") renderDashboard();
  else if(ROUTE.name==="milestone") renderMilestone(ROUTE.arg);
  else if(ROUTE.name==="topic") renderTopic(ROUTE.arg);
  else if(ROUTE.name==="bookmarks") renderLibrary("bookmarks");
  else if(ROUTE.name==="completed") renderLibrary("completed");
  else if(ROUTE.name==="settings") renderSettings();
  else if(ROUTE.name==="search") renderSearch(ROUTE.arg);
}

/* =========================================================
   NAV
   ========================================================= */
function renderNav(){
  document.querySelectorAll("#navLinks a[data-route], .nav-ic[data-route], .logo[data-route]").forEach(a=>{
    a.classList.toggle("active", a.dataset.route===ROUTE.name);
  });
  const dd=document.getElementById("msDropdown");
  dd.innerHTML=ROADMAP.map(m=>`<div class="ms-dd-item" data-msopen="${m.id}">
    <span class="dot" style="background:${m.color}"></span>${m.title}<span class="pc">${msProgress(m)}%</span></div>`).join("");
  dd.querySelectorAll("[data-msopen]").forEach(e=>e.onclick=()=>navigate("milestone",e.dataset.msopen));
  const lt=document.getElementById("langToggle");
  lt.innerHTML = STATE.lang==="vi" ? `🌐 <b>VI</b> / EN` : `🌐 <b>EN</b> / VI`;
}

    rowsHtml+=row(`Milestone ${m.n} · ${m.title}`, m.topics.map(topicTile).join(""), null);
  });
  if(marks.length) rowsHtml+=row("My List", marks.map(([id,r])=>vcard(toV(id,r))).join(""), marks.length);

  view.innerHTML=`

      <section class="hero">
        <div class="hero-bg" style="${heroBg}"></div>
        <div class="hero-fade"></div>
        <div class="hero-content">
          <div class="eyebrow"><span class="tag">MBA+</span> Milestone ${reco.ms.n} · ${reco.ms.title}</div>
          <h1>${reco.topic}</h1>
          <div class="meta-line">
            <span class="match">${overall}% Mastery</span>
            <span class="pill">${completedVideos().length} completed</span>
            <span class="pill">${learningHours().toFixed(1)} hrs</span>
            <span class="pill">🔥 ${currentStreak()} day streak</span>
          </div>
          <p>${reco.ms.desc}</p>
          <div class="hero-btns">
            <button class="btn-play" data-topicopen="${rtid}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21"/></svg> Start Learning</button>
            <button class="btn-more" data-msopen="${reco.ms.id}">

          </div>
        </div>
      </section>
      ${banner}
      <div class="rows">${rowsHtml || skelGrid()}</div>
    </div>`;

  if(!getApiKey()){
    const sk=document.getElementById("saveKeyBtn");
    if(sk) sk.onclick=()=>{ const v=document.getElementById("apiKeyInput").value.trim(); if(v){ localStorage.setItem(LS.key,v); toast("API key saved"); refreshAll(); } };

function toV(id,r){ return {id, title:r.title, channel:r.channel, thumb:r.thumb, dur:r.dur, durLabel:secLabel(r.dur), topic:r.topic, views:0, published:null}; }

let TOPIC_TAB="newest";
async function renderTopic(tid){
  const t=findTopic(tid); if(!t) return navigate("dashboard");
  const view=document.getElementById("view"); const tp=topicProgress(tid);
  view.innerHTML=`<div class="page">
    <div class="page-head"><div class="eyebrow" style="color:${t.ms.color}">Milestone ${t.ms.n} · ${t.ms.title}</div><h2>${t.topic}</h2>
      <p>Curated YouTube lessons for "${t.topic}", refreshed automatically from YouTube Data API v3.</p></div>
    <div class="panel" style="margin-bottom:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px"><b>Topic mastery</b><b style="color:${t.ms.color}">${tp}%</b></div>
        <div class="pbar ${tp===100?'green':''}"><i style="width:${tp}%"></i></div></div>
      <button class="btn btn-ghost" id="topicRefresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg>Refresh</button>
    </div>
    <div class="row-tabs" id="topicTabs"></div>
    <div id="topicContent">${skelGrid()}</div></div>`;
  document.getElementById("topicRefresh").onclick=async()=>{
    document.getElementById("topicContent").innerHTML=skelGrid();
    try{ await fetchTopic(t.topic,{force:true}); toast("Feed refreshed"); }catch(e){ handleErr(e); }
    paintTopic(tid);
  };
  let items=[];
  try{ items=await fetchTopic(t.topic); }
  catch(e){ handleErr(e); const tc=document.getElementById("topicContent"); if(tc) tc.innerHTML=errBlock(e); return; }
  if(ROUTE.name!=="topic" || ROUTE.arg!==tid) return; // user navigated away
  paintTopic(tid, items);
}
function paintTopic(tid, preItems){
  const t=findTopic(tid); if(!t) return;
  const items=preItems || (CACHE[cacheKey(tid)]?.items || []);
  const tabsEl=document.getElementById("topicTabs"); if(!tabsEl) return;
  const newest=[...items].sort((a,b)=>new Date(b.published)-new Date(a.published));
  const mostViewed=[...items].sort((a,b)=>b.views-a.views);
  const recommended=[...items].sort((a,b)=>rankScore(b)-rankScore(a)).slice(0,12);
  const completed=items.filter(v=>rec(v.id)?.status==="completed");
  const bookmarked=items.filter(v=>rec(v.id)?.bookmarked);
  const tabs=[
    {k:"newest",label:"Newest",data:newest},
    {k:"viewed",label:"Most Viewed",data:mostViewed},
    {k:"reco",label:"Recommended",data:recommended},
    {k:"completed",label:"Completed",data:completed},
    {k:"bookmarked",label:"My List",data:bookmarked},
  ];
  tabsEl.innerHTML=tabs.map(tb=>`<button class="row-tab ${TOPIC_TAB===tb.k?'active':''}" data-tab="${tb.k}">${tb.label}<span class="cnt">${tb.data.length}</span></button>`).join("");
  tabsEl.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TOPIC_TAB=b.dataset.tab;paintTopic(tid);});
  const active=tabs.find(x=>x.k===TOPIC_TAB)||tabs[0];
  const content=document.getElementById("topicContent");
  content.innerHTML=active.data.length
    ? `<div class="vid-grid">${active.data.map(vcard).join("")}</div>`
    : emptyState(`No ${active.label.toLowerCase()} videos yet`,
        active.k==="completed"?"Mark lessons as Done to see them here.":
        active.k==="bookmarked"?"Add lessons to My List to build your shortlist.":"Try refreshing the feed.");
  wireCards(content);
}

  view.innerHTML=`<div class="page">
    <div class="page-head"><div class="eyebrow">My Library</div><h2>${title}</h2><p>${sub}</p></div>
    ${kind==="completed"?`<div class="stat-grid"><div class="stat"><div class="lbl">Completed</div><div class="val">${entries.length}</div></div><div class="stat"><div class="lbl">Hours Logged</div><div class="val">${learningHours().toFixed(1)}</div></div></div>`:""}
    <div id="libContent"></div></div>`;
  const c=document.getElementById("libContent");
  c.innerHTML=entries.length
    ? `<div class="vid-grid">${entries.map(([id,r])=>vcard(toV(id,r))).join("")}</div>`
    : emptyState(kind==="bookmarks"?"My List is empty":"Nothing completed yet",
        kind==="bookmarks"?"Save lessons with the My List button.":"Finish a lesson to start your record.");

}

   SEARCH
   ========================================================= */
async function renderSearch(q){
  const view=document.getElementById("view");
  view.innerHTML=`<div class="page"><div class="page-head"><div class="eyebrow">Search</div><h2>Results for "${esc(q)}"</h2></div><div id="searchContent">${skelGrid()}</div></div>`;
  const matchTopics=ALL_TOPICS.filter(x=>x.topic.toLowerCase().includes(q.toLowerCase()));
  let html="";
  if(matchTopics.length){
    html+=`<div class="section"><div class="section-head"><h3>Curriculum topics</h3></div><div class="topic-list">
      ${matchTopics.map(x=>`<div class="topic-row" data-topicopen="${topicId(x.topic)}"><div class="t-ic">📘</div><div style="flex:1"><div class="t-name">${x.topic}</div><div class="t-meta">Milestone ${x.ms.n} · ${x.ms.title}</div></div></div>`).join("")}
    </div></div>`;
  }
  try{
    const sParams={part:"snippet",q:q,type:"video",maxResults:12,videoEmbeddable:"true",safeSearch:"strict",relevanceLanguage:(STATE.lang==="vi"?"vi":"en")};
    if(STATE.lang==="vi") sParams.regionCode="VN";
    const search=await ytFetch("/search",sParams);
    const ids=(search.items||[]).map(i=>i.id.videoId).filter(Boolean);
    let vids=[];
    if(ids.length){
      const det=await ytFetch("/videos",{part:"snippet,contentDetails,statistics",id:ids.join(",")});
      vids=(det.items||[]).map(v=>{const d=parseDuration(v.contentDetails?.duration);return{id:v.id,title:v.snippet.title,channel:v.snippet.channelTitle,thumb:(v.snippet.thumbnails?.medium||{}).url||"",published:v.snippet.publishedAt,views:+(v.statistics?.viewCount||0),dur:d.sec,durLabel:d.label,topic:"search"};});
    }
    html+=`<div class="section"><div class="section-head"><h3>YouTube results</h3></div>${vids.length?`<div class="vid-grid">${vids.map(vcard).join("")}</div>`:emptyState("No videos found")}</div>`;
  }catch(e){ html+=errBlock(e); }
  const sc=view.querySelector("#searchContent"); sc.innerHTML=html;
  wireCommon(sc);
}

async function switchLanguage(lang){
  if(STATE.lang===lang) return;
  STATE.lang=lang; persist();
  toast(lang==="vi"?"Đã chuyển sang Tiếng Việt — đang tải lại…":"Switched to English — refreshing…");
  const note=document.getElementById("langNote");
  if(note) note.textContent=lang==="vi"?"Đang truy vấn lại YouTube bằng từ khóa tiếng Việt…":"Re-querying YouTube with English keywords…";
  rerender();
  await refreshAll();
}

/* =========================================================
   WIRING
   ========================================================= */
function resolveVideo(id){
  for(const ck in CACHE){ const found=(CACHE[ck].items||[]).find(v=>v.id===id); if(found) return found; }
  const r=STATE.videos[id];
  if(r) return toV(id,r);
  return null;
}
function wireCards(scope){
  scope.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>openVideo(e.dataset.open));
  scope.querySelectorAll(".vcard").forEach(card=>{
    const id=card.dataset.vid; const getV=()=>resolveVideo(id);
    card.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick=(ev)=>{ ev.stopPropagation(); const v=getV(); if(!v) return; const a=btn.dataset.act;
        if(a==="complete") setStatus(v,"completed");
        else if(a==="progress") setStatus(v,"in-progress");
        else if(a==="bookmark") toggleBookmark(v);
        else if(a==="note"){ const p=card.querySelector("[data-notepanel]"); if(p) p.classList.toggle("hidden"); } };
    });
    card.querySelectorAll("[data-rate]").forEach(st=>{ st.onclick=(ev)=>{ev.stopPropagation();const v=getV();if(v)setRating(v,+st.dataset.rate);}; });
    const ta=card.querySelector("[data-notepanel] textarea");
    if(ta){ let nt; ta.onclick=(ev)=>ev.stopPropagation();
      ta.oninput=(ev)=>{ clearTimeout(nt); const val=ev.target.value; nt=setTimeout(()=>{ const v=getV(); if(v){ ensureRec(v); setNote(id,val); } },500); }; }
  });
}
function wireRows(scope){
  scope.querySelectorAll(".row-wrap").forEach(w=>{
    const track=w.querySelector(".row-track");
    const l=w.querySelector(".row-nav.left"), r=w.querySelector(".row-nav.right");
    if(l) l.onclick=()=>track.scrollBy({left:-track.clientWidth*0.82,behavior:"smooth"});
    if(r) r.onclick=()=>track.scrollBy({left:track.clientWidth*0.82,behavior:"smooth"});
  });
}
function wireCommon(scope){
  wireCards(scope);
  wireRows(scope);
  scope.querySelectorAll("[data-topicopen]").forEach(e=>e.onclick=(ev)=>{ev.stopPropagation();navigate("topic",e.dataset.topicopen);});
  scope.querySelectorAll("[data-msopen]").forEach(e=>e.onclick=(ev)=>{ev.stopPropagation();navigate("milestone",e.dataset.msopen);});
}

/* =========================================================
   ERRORS
   ========================================================= */
function handleErr(e){
  if(String(e.message).includes("NO_API_KEY")) toast("Add your YouTube API key first");
  else if(String(e.message).includes("quota")) toast("YouTube quota exceeded — try later");
  else toast("Could not load videos");
}
function errBlock(e){
  const noKey=String(e.message).includes("NO_API_KEY");
  return `<div class="empty">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <p>${noKey?"YouTube API key required":"Couldn't load videos"}</p>
    <p class="sm">${noKey?"Open Settings and paste your YouTube Data API v3 key.":esc(String(e.message))}</p></div>`;
}

/* =========================================================
   REFRESH ALL
   ========================================================= */
async function refreshAll(){
  const key=getApiKey();
  if(!key){ toast("Add your YouTube API key first"); navigate("settings"); return; }
  const btn=document.getElementById("refreshBtn"); btn.classList.add("spinning");
  let ok=0;
  for(const x of ALL_TOPICS){
    try{ await fetchTopic(x.topic,{force:true}); ok++; if(ROUTE.name==="dashboard" && ok%3===0) renderDashboard(); }
    catch(e){ if(String(e.message).includes("quota")){ toast("Quota exceeded — stopped early"); break; } }
  }
  btn.classList.remove("spinning");
  toast(`Updated ${ok} topic feeds`);
  rerender();
}

/* =========================================================
   INIT
   ========================================================= */
document.querySelectorAll("[data-route]").forEach(a=>{ a.onclick=()=>navigate(a.dataset.route); });
document.getElementById("refreshBtn").onclick=refreshAll;
document.getElementById("langToggle").onclick=()=>switchLanguage(STATE.lang==="vi"?"en":"vi");
document.getElementById("globalSearch").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const q=e.target.value.trim(); if(q) navigate("search",q); } });
window.addEventListener("scroll",()=>{ document.getElementById("nav").classList.toggle("scrolled", window.scrollY>40); });

renderNav();
renderDashboard();

// quiet prefetch of recommended topic if key present
(async()=>{
  if(getApiKey()){
    const anyFresh=Object.values(CACHE).some(c=>c.items?.length && (Date.now()-c.fetched)<1000*60*60*12);
    if(!anyFresh){ const reco=recommendedTopic(); try{ await fetchTopic(reco.topic); }catch(e){} if(ROUTE.name==="dashboard") rerender(); }
  }
})();
</script>
